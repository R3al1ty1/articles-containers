server {
    listen 80;
    server_name opensci.ru www.opensci.ru;

    # Improved logging for debugging
    access_log /var/log/nginx/opensci_access.log;
    error_log /var/log/nginx/opensci_error.log warn;

    # More robust host mapping
    set $upstream_host "web:8000";
    set $vnc_host "172.17.0.1";

    # Added resolver to ensure proper DNS resolution
    resolver 8.8.8.8 valid=30s;
    resolver_timeout 10s;

    location / {
        proxy_pass http://$upstream_host;
        
        # Enhanced proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Additional proxy settings for improved reliability
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Handle potential network changes
        proxy_intercept_errors on;
    }

    location ~ ^/vnc/(\d+)/(.*) {
        # More flexible VNC routing
        proxy_pass http://$vnc_host:$1/$2$is_args$args;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        
        # Additional WebSocket proxy settings
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Increased keepalive timeout
    keepalive_timeout 75s;

    # Added error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}