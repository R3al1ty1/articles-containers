[supervisord]
nodaemon=true
user=root

[program:dbus]
command=/usr/bin/dbus-daemon --system --nofork
autostart=true
autorestart=true

[program:Xvfb]
command=Xvfb :99 -screen 0 1920x1080x24 -ac +extension RANDR
autostart=true
autorestart=true

[program:x11vnc]
command=x11vnc -display :99 -forever -nopw -shared -noxdamage -repeat
autostart=true
autorestart=true

[program:chrome]
command=google-chrome --no-sandbox \
    --disable-dev-shm-usage \
    --disable-gpu \
    --remote-debugging-port=9222 \
    --user-data-dir=/tmp/chrome-profile \
    --display=:99 \
    --start-maximized \
    --no-first-run \
    --no-default-browser-check \
    --enable-logging \
    --v=1
autostart=true
autorestart=true

[program:novnc]
command=/root/noVNC/utils/novnc_proxy --vnc localhost:5900 --listen 6080
autostart=true
autorestart=true