[supervisord]
nodaemon=true
user=root

[program:Xvfb]
command=Xvfb :99 -screen 0 1280x720x24
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:x11vnc]
command=x11vnc -display :99 -forever -nopw
autostart=true
autorestart=true
priority=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:squid]
command=/usr/sbin/squid -N -f /etc/squid/squid.conf
autostart=true
autorestart=true
priority=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:chrome]
command=google-chrome --no-sandbox --disable-dev-shm-usage --remote-debugging-port=9222 \
       --load-extension=/root/chrome-extension \
       --user-data-dir=/root/chrome-profile --display=:99 --window-size=1280,720 \
       --no-first-run --no-default-browser-check \
       --proxy-server="http://127.0.0.1:3128" \
       https://www.scopus.com
autostart=true
autorestart=true
priority=100
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:novnc]
command=/root/noVNC/utils/novnc_proxy --vnc localhost:5900 --listen 6080
autostart=true
autorestart=true
priority=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[eventlistener:keyboard_setup]
command=setxkbmap -layout us -display :99
events=PROCESS_STATE_RUNNING
process_name=Xvfb
autostart=true
autorestart=false
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0