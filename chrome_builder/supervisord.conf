[supervisord]
nodaemon=true

[program:Xvfb]
command=Xvfb :99 -screen 0 1280x720x24
autostart=true
autorestart=true
priority=10

# Новая программа для установки английской раскладки
[program:keyboard_layout]
command=setxkbmap -layout us -display :99
autostart=true
startsecs=1
autorestart=false ; Выполнить один раз и завершиться
priority=20

[program:x11vnc]
command=x11vnc -display :99 -forever -nopw
autostart=true
autorestart=true
priority=100

[program:squid]
command=/usr/sbin/squid -N -f /etc/squid/squid.conf
autostart=true
autorestart=true
priority=100

[program:chrome]
command=google-chrome --no-sandbox --disable-dev-shm-usage --remote-debugging-port=9222 \
       --load-extension=/root/chrome-extension \
       --user-data-dir=/root/chrome-profile --display=:99 --window-size=1280,720 \
       --no-first-run --no-default-browser-check \
       --proxy-server="http://127.0.0.1:3128" \
       --downloads-directory=/root/Downloads \
       https://www.scopus.com
autostart=true
autorestart=true
priority=100

[program:novnc]
command=/root/noVNC/utils/novnc_proxy --vnc localhost:5900 --listen 6080
autostart=true
autorestart=true
priority=100