version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6378
    depends_on:
      - redis
    volumes:
      - ./containers:/app/containers
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock

  redis:
    image: redis:alpine
    ports:
      - "6378:6378"
    volumes:
      - redis_data:/data
    command: redis-server --port 6378

volumes:
  redis_data: