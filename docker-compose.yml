services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6378
    networks:
      - app_network
    depends_on:
      - redis
    volumes:
      - ./containers:/app/containers:z
      - ./data:/app/data:z
      - /baixo/downloads:/baixo/downloads:z
      - /var/run/docker.sock:/var/run/docker.sock:z
    restart: no

  redis:
    image: redis:alpine
    command: redis-server --port 6378
    volumes:
      - redis_data:/data
    networks:
      - app_network
    ports:
      - "6378:6378"
    restart: no

  nginx:
    image: nginx:alpine
    network_mode: host
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
    restart: no
    stop_signal: SIGTERM
    init: true

networks:
  app_network:
    driver: bridge

volumes:
  redis_data:
