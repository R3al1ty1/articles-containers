version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6378
    networks:
      - app_network
    depends_on:
      - redis
    volumes:
      - ./containers:/app/containers
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /baixo/downloads:/baixo/downloads

  redis:
    image: redis:alpine
    command: redis-server --port 6378
    volumes:
      - redis_data:/data
    networks:
      - app_network
    ports:
      - "6378:6378"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl
    networks:
      - app_network
    depends_on:
      - web

networks:
  app_network:
    driver: bridge

volumes:
  redis_data: